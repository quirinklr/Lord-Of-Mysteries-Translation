name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: python -m compileall -q tools tests
      - run: dotnet build tools\iostore_inventory\iostore_inventory.csproj --configuration Release --nologo -p:RestoreLockedMode=true
      - run: dotnet list tools\iostore_inventory\iostore_inventory.csproj package --include-transitive --vulnerable
      - run: python tools\sync_patch_package.py
      - run: python -m unittest discover -s tests -v
      - run: git diff --exit-code
